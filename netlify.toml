# Netlify deployment configuration
# Following 12-factor app principles and Vibe Coding Playbook best practices

[build]
  # Build command - Vite production build
  # Netlify installs the locked dependencies before this command runs.
  command = "npm run gate:onboarding:static && npm run test:deploy && npm run build"

  # Publish directory - Vite builds to dist folder
  publish = "dist"

  # Functions directory for serverless functions (future use)
  functions = "netlify/functions"

[functions]
  # Preserve server-only SDKs in each deployed function artifact.
  node_bundler = "esbuild"
  external_node_modules = ["@google/genai", "@supabase/supabase-js", "ws"]

[build.environment]
  # Build-time environment variables
  NODE_VERSION = "22"
  NODE_ENV = "development"
  NPM_CONFIG_PRODUCTION = "false"
  ENABLE_API_FEATURES = "false"
  VITE_ENABLE_API_FEATURES = "false"
  ENABLE_AI_PORTRAITS = "false"
  VITE_ENABLE_AI_PORTRAITS = "false"
  ENABLE_AI_VIDEOS = "false"
  VITE_ENABLE_AI_VIDEOS = "false"

# Redirect rules for single-page application behavior
[[redirects]]
  # Keep the stable runtime-observability alias explicit. A function-level
  # custom path can shadow this route and return Netlify's cached 404 page.
  from = "/api/observability-events"
  to = "/.netlify/functions/observability-events"
  status = 200
  force = true

[[redirects]]
  # Privacy-safe, approximate count of game tabs active in the last 90 seconds.
  from = "/api/live-presence"
  to = "/.netlify/functions/live-presence"
  status = 200
  force = true

[[redirects]]
  # Handle API routes (when implemented)
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  # Serve game files with proper MIME types
  from = "/*.js"
  to = "/:splat"
  status = 200
  headers = {Content-Type = "application/javascript"}

[[redirects]]
  # Keep the dedicated story page ahead of the SPA fallback.
  from = "/story"
  to = "/story/index.html"
  status = 200

[[redirects]]
  from = "/story/"
  to = "/story/index.html"
  status = 200

[[redirects]]
