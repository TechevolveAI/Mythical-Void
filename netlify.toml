# Netlify deployment configuration

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "production"
  ENABLE_API_FEATURES = "false"

# Redirect rules for single-page application
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.x.ai; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Environment contexts
[context.production.environment]
  NODE_ENV = "production"
  ENABLE_API_FEATURES = "false"

[context.deploy-preview.environment]
  NODE_ENV = "staging"
  ENABLE_API_FEATURES = "false"

[context.branch-deploy.environment]
  NODE_ENV = "development"
  ENABLE_API_FEATURES = "true"

[dev]
  port = 8080
  targetPort = 8080
  autoLaunch = true
