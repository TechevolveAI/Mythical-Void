# Withdrawn visual media must not remain reachable through an old direct link.
# A file can remain in the internal release record without remaining public.
[[redirects]]
  from = "/press/gameplay/*"
  to = "/press/"
  status = 302
  force = true

[[redirects]]
  from = "/press/gameplay-video/*"
  to = "/press/"
