# Netlify deployment configuration
# Following 12-factor app principles and Vibe Coding Playbook best practices

[build]
  # Build command - Vite production build
  # Netlify installs the locked dependencies before this command runs.
  command = "npm run build"

  # Publish directory - Vite builds to dist folder
  publish = "dist"

  # Functions directory for serverless functions (future use)
  functions = "netlify/functions"

[build.environment]
  # Build-time environment variables
  NODE_VERSION = "20"
  NODE_ENV = "development"
  NPM_CONFIG_PRODUCTION = "false"
  ENABLE_API_FEATURES = "false"
  VITE_ENABLE_API_FEATURES = "false"
  ENABLE_AI_PORTRAITS = "false"
  VITE_ENABLE_AI_PORTRAITS = "false"

# Redirect rules for single-page application behavior
[[redirects]]
  # Handle API routes (when implemented)
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  # Serve game files with proper MIME types
  from = "/*.js"
  to = "/:splat"
  status = 200
  headers = {Content-Type = "application/javascript"}

[[redirects]]
  # Fallback to index.html for client-side routing
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (following OWASP best practices)
[[headers]]
  for = "/*"
  [headers.values]
    # HTTPS and security
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Content Security Policy (restrictive for security)
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https://*.nasa.gov https://apod.nasa.gov https://mars.nasa.gov https://replicate.delivery https://*.replicate.delivery;
      connect-src 'self' https://mkcmdbzcihjgidjuypqe.supabase.co https://api.x.ai https://api.nasa.gov https://api.replicate.com;
      font-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self'
    """
    
    # Feature Policy (limit access to sensitive features)
    Permissions-Policy = """
      accelerometer=(),
      camera=(),
      geolocation=(),
      gyroscope=(),
      magnetometer=(),
      microphone=(),
      payment=(),
      usb=()
    """

# Specific headers for JavaScript files
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

# Headers for HTML files (always check for updates)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment-specific configurations
[context.production.environment]
  NODE_ENV = "production"
  ENABLE_API_FEATURES = "false"
  VITE_ENABLE_API_FEATURES = "false"
  ENABLE_AI_PORTRAITS = "false"
  VITE_ENABLE_AI_PORTRAITS = "false"

[context.deploy-preview.environment]
  NODE_ENV = "staging"
  ENABLE_API_FEATURES = "false"
  VITE_ENABLE_API_FEATURES = "false"
  ENABLE_AI_PORTRAITS = "false"
  VITE_ENABLE_AI_PORTRAITS = "false"

[context.branch-deploy.environment]
  NODE_ENV = "development"
  ENABLE_API_FEATURES = "true"
  VITE_ENABLE_API_FEATURES = "true"
  ENABLE_AI_PORTRAITS = "false"
  VITE_ENABLE_AI_PORTRAITS = "false"

# Form handling (future use for feedback/contact forms)
[forms]
  # Enable Netlify Forms
  
# Development settings
[dev]
  # Local development server settings
  port = 8080
  targetPort = 8080
  autoLaunch = true
