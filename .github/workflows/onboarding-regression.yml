name: Onboarding regression firewall

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opening-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gate:onboarding:static
      - run: npm run build:onboarding-ci
      - name: Run golden browser journeys
        env:
          CHROME_PATH: /usr/bin/google-chrome
          MYTHICAL_VOID_SMOKE_PROCESS_COOLDOWN_MS: 100
        run: npm run smoke:onboarding-golden
