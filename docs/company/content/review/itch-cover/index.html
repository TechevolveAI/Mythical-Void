<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Private Mythical Void itch.io cover candidate</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #090711;
      color: #fff8ec;
      font-family: Inter, ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
    }
    .cover {
      position: relative;
      width: 630px;
      height: 500px;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 46%, rgba(166, 68, 255, .26), transparent 34%),
        radial-gradient(circle at 18% 12%, rgba(118, 227, 207, .12), transparent 31%),
        linear-gradient(145deg, #090711 0%, #100a25 57%, #090711 100%);
      border: 1px solid rgba(255, 248, 236, .14);
    }
    .cover::before,
    .cover::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(118, 227, 207, .18);
      border-radius: 50%;
      pointer-events: none;
    }
    .cover::before { width: 410px; height: 410px; right: -118px; top: 32px; }
    .cover::after { width: 286px; height: 286px; right: -56px; top: 94px; border-color: rgba(171, 102, 255, .34); }
    .signal-dots {
      position: absolute;
      inset: 0;
      opacity: .8;
      background-image:
        radial-gradient(circle at 8% 18%, #76e3cf 0 1.5px, transparent 2px),
        radial-gradient(circle at 48% 8%, #ffce60 0 1.4px, transparent 2px),
        radial-gradient(circle at 55% 68%, #76e3cf 0 1.4px, transparent 2px),
        radial-gradient(circle at 18% 82%, #ab66ff 0 1.4px, transparent 2px),
        radial-gradient(circle at 88% 88%, #76e3cf 0 1.4px, transparent 2px);
    }
    .copy {
      position: absolute;
      z-index: 2;
      left: 42px;
      top: 38px;
      width: 360px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      margin: 0 0 28px;
      padding: 0 14px;
      border-radius: 999px;
      background: #76e3cf;
      color: #090711;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .11em;
    }
    .name {
      margin: 0 0 24px;
      color: #d9c4ff;
      font-size: 20px;
      font-weight: 850;
      letter-spacing: .16em;
    }
    h1 {
      width: 365px;
      margin: 0;
      font-size: 51px;
      line-height: .98;
      letter-spacing: -.045em;
    }
    h1 span { display: block; color: #ffce60; }
    .promise {
      width: 335px;
      margin: 24px 0 0;
      color: #d8d1e6;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.38;
    }
    .emblem-wrap {
      position: absolute;
      z-index: 3;
      right: 24px;
      top: 51px;
      width: 235px;
      height: 384px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .42));
    }
    .emblem-wrap img {
      width: auto;
      height: 365px;
      object-fit: contain;
    }
    .footer {
      position: absolute;
      z-index: 4;
      left: 42px;
      right: 42px;
      bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 248, 236, .16);
      color: #a9a2bd;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .14em;
    }
  </style>
</head>
<body>
  <main class="cover" aria-label="Mythical Void brand cover candidate">
    <div class="signal-dots" aria-hidden="true"></div>
    <section class="copy">
      <p class="eyebrow">EARLY ACCESS · PLAY FREE</p>
      <p class="name">MYTHICAL VOID</p>
      <h1>HATCH A CREATURE.<span>CROSS LIVING WORLDS.</span></h1>
      <p class="promise">A strange single-player adventure for your browser.</p>
    </section>
    <div class="emblem-wrap"><img src="/marketing/mythical-void-emblem-v3.png" alt=""></div>
    <footer class="footer"><span>BROWSER ADVENTURE</span><span>BRAND COVER · NOT GAMEPLAY</span></footer>
  </main>
</body>
</html>
