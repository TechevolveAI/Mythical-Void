<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mythical Void brand link preview</title>
    <style>
        :root {
            --night: #070611;
            --paper: #fff9ed;
            --mint: #7ce8cf;
            --gold: #ffd66b;
            font-family: "Avenir Next", Avenir, Inter, system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        html,
        body {
            width: 1200px;
            height: 630px;
            margin: 0;
            overflow: hidden;
            background: var(--night);
        }

        body {
            color: var(--paper);
            background:
                radial-gradient(circle at 82% 45%, rgba(134, 55, 255, .22), transparent 31%),
                radial-gradient(circle at 4% 102%, rgba(43, 204, 177, .14), transparent 35%),
                linear-gradient(138deg, #0c0a1c 0%, #070611 62%, #120825 100%);
        }

        .card {
            position: relative;
            display: grid;
            width: 100%;
            height: 100%;
            grid-template-columns: minmax(0, 1fr) 440px;
            gap: 30px;
            padding: 48px 56px 42px;
        }

        .card::before,
        .card::after {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--mint);
            box-shadow: 175px 82px 0 -2px rgba(124, 232, 207, .68), 346px -32px 0 -3px rgba(255, 214, 107, .7);
            content: "";
            opacity: .8;
        }

        .card::before { top: 78px; left: 578px; }
        .card::after { right: 108px; bottom: 78px; transform: rotate(175deg); }

        .copy {
            z-index: 1;
            display: flex;
            min-width: 0;
            flex-direction: column;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            font-size: 20px;
            font-weight: 950;
            letter-spacing: .15em;
        }

        .brand img {
            width: 37px;
            height: 52px;
            object-fit: contain;
            filter: drop-shadow(0 0 16px rgba(176, 82, 255, .58));
        }

        .message {
            margin: auto 0;
        }

        .kicker {
            margin: 0 0 18px;
            color: var(--mint);
            font-size: 17px;
            font-weight: 950;
            letter-spacing: .15em;
        }

        h1 {
            max-width: 670px;
            margin: 0;
            font-family: "Arial Rounded MT Bold", "Avenir Next", ui-rounded, system-ui, sans-serif;
            font-size: 72px;
            line-height: .95;
            letter-spacing: -.05em;
        }

        h1 span { color: var(--gold); }

        .promise {
            max-width: 650px;
            margin: 22px 0 0;
            color: #d8d0e7;
            font-size: 24px;
            font-weight: 650;
            line-height: 1.3;
        }

        .footer {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .play {
            padding: 13px 19px;
            border-radius: 999px;
            background: var(--mint);
            color: #07131a;
            font-size: 15px;
            font-weight: 950;
            letter-spacing: .035em;
        }

        .url {
            font-size: 16px;
            font-weight: 850;
        }

        .emblem-stage {
            position: relative;
            display: grid;
            place-items: center;
            isolation: isolate;
        }

        .emblem-stage::before,
        .emblem-stage::after {
            position: absolute;
            z-index: -1;
            border: 1px solid rgba(124, 232, 207, .18);
            border-radius: 50%;
            content: "";
        }

        .emblem-stage::before { width: 390px; height: 390px; }
        .emblem-stage::after { width: 315px; height: 315px; border-color: rgba(255, 214, 107, .13); }

        .emblem {
            width: 335px;
            height: 510px;
            object-fit: contain;
            filter: drop-shadow(0 16px 30px rgba(0, 0, 0, .6)) drop-shadow(0 0 24px rgba(176, 82, 255, .34));
        }

        .boundary {
            position: absolute;
            right: 2px;
            bottom: 0;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, .24);
            border-radius: 999px;
            background: rgba(7, 6, 17, .88);
            color: #ddd5e8;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .09em;
        }
    </style>
</head>
<body>
    <main class="card" aria-label="Mythical Void brand link preview">
        <section class="copy">
            <div class="brand"><img src="../../public/marketing/mythical-void-emblem-v3.png" alt=""><span>MYTHICAL VOID</span></div>
            <div class="message">
                <p class="kicker">FREE BROWSER ADVENTURE</p>
                <h1>Hatch an alien creature. <span>Cross six living realms.</span></h1>
                <p class="promise">A father-and-son game built with imagination, generative AI tools and Phaser.</p>
            </div>
            <footer class="footer"><span class="play">PLAY NOW — NO DOWNLOAD</span><span class="url">mythicalvoid.com</span></footer>
        </section>
        <figure class="emblem-stage">
            <img class="emblem" src="../../public/marketing/mythical-void-emblem-v3.png" alt="">
            <figcaption class="boundary">BRAND ART — NOT GAMEPLAY</figcaption>
        </figure>
    </main>
</body>
</html>
