    <script>
    (function () {
        var path = window.location.pathname.replace(/\/+$/, '') || '/';
        var params = new URLSearchParams(window.location.search);
        var isGameRoute = path === '/play' || path === '/game' || params.has('testBoss');
        if (isGameRoute) return;

        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = window.gtag || gtag;
        window.MYTHICAL_GOOGLE_TAG_ID = 'G-FTM4W73ECQ';
        var allowedEvents = ['play_selected', 'share_completed', 'share_link_copied'];
        var allowedAreas = ['header', 'hero', 'content', 'share_section', 'final_cta', 'footer'];
        gtag('consent', 'default', {
            analytics_storage: 'denied',
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied',
            wait_for_update: 500
        });
        gtag('js', new Date());
        gtag('config', window.MYTHICAL_GOOGLE_TAG_ID, {
            send_page_view: false,
            allow_google_signals: false,
            allow_ad_personalization_signals: false,
            page_location: window.location.origin + path,
            page_path: path
        });
        var tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.MYTHICAL_GOOGLE_TAG_ID;
        document.head.appendChild(tag);
        window.MythicalAnalytics = {
            getConsent: function () {
                try { return window.localStorage.getItem('mythical-analytics-consent'); } catch (error) { return null; }
            },
            setConsent: function (value) {
                if (value !== 'granted' && value !== 'denied') return;
                try { window.localStorage.setItem('mythical-analytics-consent', value); } catch (error) { /* private browsing can refuse storage */ }
                window.gtag('consent', 'update', {
                    analytics_storage: value,
                    ad_storage: 'denied',
                    ad_user_data: 'denied',
                    ad_personalization: 'denied'
                });
                if (value === 'granted') {
                    window.gtag('config', window.MYTHICAL_GOOGLE_TAG_ID, {
                        send_page_view: true,
                        allow_google_signals: false,
                        allow_ad_personalization_signals: false,
                        page_location: window.location.origin + path,
                        page_path: path
                    });
                }
                window.dispatchEvent(new CustomEvent('mythical:analytics-consent', { detail: { value: value } }));
            },
            track: function (eventName, details) {
                if (this.getConsent() !== 'granted' || allowedEvents.indexOf(eventName) === -1) return false;
                details = details || {};
                var sourceArea = allowedAreas.indexOf(details.source_area) === -1 ? 'content' : details.source_area;
                window.gtag('event', eventName, {
                    source_page: path,
                    source_area: sourceArea,
                    transport_type: 'beacon'
                });
                return true;
            }
        };
    }());
    </script>
